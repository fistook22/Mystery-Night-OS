<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Mystery Night — 15s storyboard v2</title>
<link rel="stylesheet" href="cards.css">
<style>
:root{
  --gold:#e8b64a; --gold2:#ffd98a; --red:#ff3b30; --green:#30d158;
  --ig1:#feda75; --ig2:#fa7e1e; --ig3:#d62976; --ig4:#962fbf; --ig5:#4f5bd5;   /* Pixelgram palette */
  --tw:#9147ff; --twbg:#0e0e10; --twp:#18181b;                                   /* Streamly palette */
  --ui:"Liberation Sans","DejaVu Sans",sans-serif; --serif:"DejaVu Serif","FreeSerif",serif; --mono:"DejaVu Sans Mono","Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:var(--ui);color:#fff}
.frame{width:1080px;height:1920px;position:relative;overflow:hidden;background:#000;margin-bottom:40px}
.abs{position:absolute}
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;opacity:.13;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:55;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%)}

/* iOS-like status bar */
.sb{position:absolute;top:0;left:0;right:0;height:120px;direction:ltr;display:flex;align-items:center;justify-content:space-between;padding:40px 78px 0 92px;font:700 42px var(--ui);z-index:50}
.sb .ic{display:flex;gap:14px;align-items:center}
.sb .bars{display:flex;gap:5px;align-items:flex-end;height:28px}.sb .bars i{width:8px;background:#fff;border-radius:2px;display:block}
.sb .wifi{width:40px;height:30px;background:radial-gradient(circle at 50% 100%,#fff 0 7px,transparent 8px 13px,#fff 14px 19px,transparent 20px 25px,#fff 26px 31px,transparent 32px);clip-path:polygon(0 0,100% 0,50% 100%)}
.sb .batt{width:62px;height:30px;border:3px solid rgba(255,255,255,.5);border-radius:10px;padding:3px;position:relative}
.sb .batt b{display:block;height:100%;width:28%;background:#fff;border-radius:4px}
.sb .batt::after{content:"";position:absolute;right:-8px;top:8px;width:4px;height:9px;background:rgba(255,255,255,.5);border-radius:0 3px 3px 0}
.island{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:250px;height:74px;border-radius:40px;background:#000;z-index:51}
.homebar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:300px;height:10px;border-radius:6px;background:rgba(255,255,255,.85);z-index:52}

/* marketing lower-third */
.lt{position:absolute;left:0;right:0;z-index:40;text-align:center;padding:0 70px}
.lt h3{font:700 86px/1.08 var(--ui);letter-spacing:-1px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.lt h3 em{font-style:normal;background:linear-gradient(90deg,#ffe7a8,#e8b64a);-webkit-background-clip:text;color:transparent}
.lt p{margin-top:22px;font:600 38px var(--ui);color:rgba(255,255,255,.82);display:flex;gap:16px;justify-content:center;align-items:center}
.lt .ai{direction:ltr;font:700 28px var(--ui);letter-spacing:2px;padding:8px 16px;border-radius:10px;color:#1a1204;background:linear-gradient(90deg,#ffe7a8,#e8b64a)}
.fade{position:absolute;left:0;right:0;bottom:0;height:760px;z-index:39;background:linear-gradient(transparent,rgba(0,0,0,.88) 62%)}
.mn{position:absolute;top:150px;right:70px;z-index:45;font:700 26px var(--ui);letter-spacing:8px;color:rgba(255,217,138,.8);direction:ltr}

/* ═══ F1 incoming call ═══ */
.poster{position:absolute;inset:0;background:#07070b;overflow:hidden}
.poster i{position:absolute;border-radius:50%;filter:blur(28px)}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 35%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.85))}
.who{position:absolute;top:210px;left:0;right:0;text-align:center;z-index:10}
.who small{font:500 40px var(--ui);color:rgba(255,255,255,.75)}
.who h1{font:700 128px/1.05 var(--ui);letter-spacing:-2px;margin-top:10px}
.mono{width:250px;height:250px;margin:70px auto 0;border-radius:50%;display:grid;place-items:center;font:500 110px var(--ui);color:#fff;
  background:linear-gradient(180deg,#a6abb8,#6c7180);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mini-actions{position:absolute;bottom:470px;left:170px;right:170px;display:flex;justify-content:space-between;direction:ltr;z-index:10}
.ma{text-align:center;font:500 32px var(--ui);color:#fff}
.ma .c{width:110px;height:110px;border-radius:50%;margin:0 auto 14px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);display:grid;place-items:center}
.ma svg{width:50px}
.big-actions{position:absolute;bottom:170px;left:140px;right:140px;display:flex;justify-content:space-between;direction:ltr;z-index:10}
.ba{text-align:center;font:500 36px var(--ui)}
.ba .c{width:176px;height:176px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center}
.ba.no .c{background:var(--red)}.ba.yes .c{background:var(--green);box-shadow:0 0 0 14px rgba(48,209,88,.18),0 0 0 32px rgba(48,209,88,.08)}
.ba svg{width:84px}
#f1 .lt{top:1040px}

/* ═══ F2 in-call + live transcript ═══ */
#f2 .poster::after{background:rgba(0,0,0,.62)}
.incall{position:absolute;top:170px;left:0;right:0;text-align:center;z-index:10}
.incall h2{font:700 70px var(--ui)}
.incall .t{font:500 44px var(--ui);color:rgba(255,255,255,.8);margin-top:10px;direction:ltr}
#f2 .lt{top:380px}
#f2 .lt h3{font-size:74px}
.tx{position:absolute;top:620px;left:60px;right:60px;height:700px;z-index:10;border-radius:44px;padding:36px 36px;
  background:rgba(30,30,36,.62);backdrop-filter:blur(30px);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.tx .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.tx .h b{font:700 36px var(--ui)}
.tx .h span{direction:ltr;font:700 26px var(--ui);letter-spacing:1px;color:#1a1204;background:linear-gradient(90deg,#ffe7a8,#e8b64a);padding:8px 18px;border-radius:30px;display:flex;gap:10px;align-items:center}
.tx .h span i{width:12px;height:12px;border-radius:50%;background:#d0021b;display:block;box-shadow:0 0 0 4px rgba(208,2,27,.25)}
.bub{max-width:80%;padding:22px 30px;border-radius:34px;font:500 40px/1.3 var(--ui);margin-bottom:22px}
.bub small{display:block;font:700 26px var(--ui);opacity:.65;margin-bottom:6px}
.bub.them{background:rgba(255,255,255,.14);margin-left:auto;border-bottom-right-radius:10px}
.bub.me{background:#0a84ff;margin-right:auto;border-bottom-left-radius:10px}
.typing{display:inline-flex;gap:10px;padding:26px 34px;border-radius:34px;background:rgba(255,255,255,.14);margin-left:auto}
.typing i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.7);display:block}
.typing i:nth-child(2){opacity:.5}.typing i:nth-child(3){opacity:.3}
.cgrid{position:absolute;top:1400px;left:120px;right:120px;display:flex;justify-content:space-between;direction:ltr;z-index:10}
.cg{text-align:center;font:500 30px var(--ui)}
.cg .c{width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);display:grid;place-items:center;margin:0 auto 14px}
.cg .c.on{background:#fff}
.cg svg{width:64px}
.end{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);width:176px;height:176px;border-radius:50%;background:var(--red);display:grid;place-items:center;z-index:10}
.end svg{width:90px}

/* ═══ Museum scene (F3/F4) ═══ */
.museum{position:absolute;inset:0;overflow:hidden;background:#12050a}
.velvet{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 34%,rgba(170,40,60,.55),transparent 55%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 3px,transparent 3px 22px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 60px,rgba(0,0,0,.2) 60px 120px),
  linear-gradient(#2a0911,#12040a 70%)}
.cone{position:absolute;top:-80px;left:190px;width:700px;height:1500px;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);
  background:linear-gradient(180deg,rgba(255,236,196,.34),rgba(255,236,196,0) 88%);filter:blur(10px)}
.dust{position:absolute;inset:0}
.dust i{position:absolute;border-radius:50%;background:#fff3d6}
.bgslab{position:absolute;top:640px;filter:blur(7px) brightness(.45);transform-origin:top center}
.bgslab.l{left:-230px;transform:scale(.5) rotate(-4deg)}
.bgslab.r{right:-230px;transform:scale(.5) rotate(4deg)}
.mainslab{position:absolute;top:300px;left:50%;transform:translateX(-50%) scale(.8);transform-origin:top center;z-index:5}
.reflect{position:absolute;top:1220px;left:50%;transform:translateX(-50%) scale(.8,-.8);transform-origin:top center;opacity:.14;z-index:4;
  -webkit-mask-image:linear-gradient(to top,#000,transparent 28%)}
.plinth{position:absolute;top:1235px;left:120px;right:120px;height:420px;z-index:3;
  background:linear-gradient(180deg,#1a1015,#070406);box-shadow:0 -2px 0 rgba(255,236,196,.25)}
.placard{position:absolute;top:1300px;left:50%;transform:translateX(-50%);z-index:6;width:640px;padding:22px 30px;border-radius:6px;
  background:linear-gradient(180deg,#232026,#141216);box-shadow:inset 0 0 0 2px rgba(232,182,74,.45),0 10px 30px rgba(0,0,0,.6);text-align:center}
.placard .a{direction:ltr;font:700 24px var(--ui);letter-spacing:4px;color:var(--gold)}
.placard .b{direction:ltr;font:400 30px var(--serif);margin-top:8px;color:#efe7d6}
.placard .c{font:700 30px var(--ui);margin-top:10px;color:#fff}
.arm{position:absolute;z-index:20}
#f3 .lt{bottom:120px}

/* F4 night-vision CCTV */
.ir{filter:grayscale(1) sepia(.5) hue-rotate(55deg) saturate(1.6) brightness(.62) contrast(1.55)}
.ir-noise{position:absolute;inset:0;z-index:30;opacity:.45;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='turbulence' baseFrequency='1.2' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .8  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.scan{position:absolute;inset:0;z-index:31;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 5px)}
.tear{position:absolute;left:0;right:0;z-index:32;background:rgba(200,255,200,.12);backdrop-filter:brightness(1.6)}
.osd{position:absolute;z-index:35;font:700 38px var(--mono);color:#e9ffe9;text-shadow:0 0 6px rgba(160,255,160,.6);direction:ltr}
.led{position:absolute;top:470px;left:0;right:0;text-align:center;z-index:36;direction:ltr}
.led b{font:700 230px/1 var(--mono);color:#ff2d2d;text-shadow:0 0 30px rgba(255,45,45,.8),0 0 90px rgba(255,45,45,.4);letter-spacing:6px}
.led span{display:block;font:700 34px var(--ui);color:#ff6b6b;letter-spacing:6px;margin-top:10px}

/* ═══ F5 UV ═══ */
#f5{background:radial-gradient(ellipse at 55% 42%,#2a0d55 0%,#0b0418 60%,#040109 100%)}
.uvbeam{position:absolute;top:-80px;right:-200px;width:1200px;height:1600px;z-index:6;mix-blend-mode:screen;
  background:linear-gradient(205deg,rgba(150,90,255,.55),rgba(120,60,255,.08) 75%);clip-path:polygon(82% 0,100% 5%,42% 100%,0 82%);filter:blur(14px)}
.torch{position:absolute;top:70px;right:20px;width:150px;height:420px;z-index:8;transform:rotate(36deg);border-radius:22px;
  background:linear-gradient(90deg,#0f0f14,#3b3b46 40%,#16161c)}
.torch::before{content:"";position:absolute;bottom:-14px;left:8px;right:8px;height:40px;border-radius:50%;background:#d6bcff;box-shadow:0 0 50px 10px #8a4dff}
.torch::after{content:"UV 365nm";position:absolute;top:120px;left:34px;transform:rotate(90deg);font:700 22px var(--mono);color:#9f7bff;letter-spacing:2px}
#f5 .mainslab{top:260px;filter:saturate(1.2)}
.uvwash{position:absolute;inset:0;z-index:7;background:radial-gradient(ellipse at 55% 40%,rgba(140,80,255,.35),transparent 60%);mix-blend-mode:multiply}
.stamp{position:absolute;top:640px;left:130px;z-index:20;transform:rotate(-13deg);padding:6px 56px;border:14px solid #ff2d2d;border-radius:26px;
  color:#ff2d2d;font:700 200px/1.05 var(--ui);background:rgba(40,0,0,.35);box-shadow:0 0 50px rgba(255,45,45,.35),inset 0 0 40px rgba(255,45,45,.25);text-shadow:0 0 20px rgba(255,45,45,.5)}
.ref{position:absolute;top:1080px;left:60px;z-index:21;width:330px;border-radius:26px;padding:18px;background:rgba(20,10,40,.8);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 2px rgba(201,168,255,.5)}
.ref .imgw{height:190px;border-radius:14px;overflow:hidden}
.ref .imgw svg{width:100%;height:100%;display:block}
.ref p{font:700 26px/1.3 var(--ui);margin-top:12px;color:#e6d6ff}
.ref p b{color:#7dffcf}
#f5 .lt{bottom:120px}

/* ═══ F6 Pixelgram story ═══ */
#f6{background:#000}
.story{position:absolute;top:120px;left:0;right:0;bottom:190px;border-radius:32px;overflow:hidden}
.mat{position:absolute;inset:0;background:
  linear-gradient(rgba(255,255,255,.22) 2px,transparent 2px) 0 0/200px 200px,
  linear-gradient(90deg,rgba(255,255,255,.22) 2px,transparent 2px) 0 0/200px 200px,
  linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px) 0 0/40px 40px,
  #1d5a45}
.mat::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 78% 12%,rgba(255,236,200,.42),transparent 45%),radial-gradient(ellipse at 50% 55%,transparent 40%,rgba(0,0,0,.55) 100%)}
.obj{position:absolute;box-shadow:0 22px 40px rgba(0,0,0,.55)}
.half{width:300px;height:470px;border-radius:26px;background:linear-gradient(120deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 40%,rgba(255,255,255,.2));box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),inset 0 0 0 12px rgba(255,255,255,.08),0 22px 40px rgba(0,0,0,.4)}
.sheet{width:420px;height:300px;background:#f7f5ef;border-radius:4px;padding:18px;display:grid;grid-template-columns:1fr;gap:12px}
.lab{height:78px;border:4px solid #c8102e;border-radius:4px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;direction:ltr;color:#111;font:700 14px/1.25 "Liberation Sans"}
.lab b{font-size:40px;color:#c8102e}
.printer{width:330px;height:220px;border-radius:30px;background:linear-gradient(160deg,#4a4b52,#232428);box-shadow:inset 0 3px 0 rgba(255,255,255,.12),0 22px 40px rgba(0,0,0,.6)}
.printer::before{content:"";position:absolute;top:36px;left:36px;right:36px;height:14px;border-radius:8px;background:#0b0b0d}
.printer::after{content:"";position:absolute;bottom:34px;right:34px;width:34px;height:34px;border-radius:50%;background:#2fd06a;box-shadow:0 0 14px #2fd06a}
.knife{width:420px;height:24px;border-radius:12px;background:linear-gradient(90deg,#d9d9de,#8e8e96 30%,#f2f2f4 60%,#8e8e96);}
.knife::after{content:"";position:absolute;right:-60px;top:2px;border-left:64px solid #cfd2d8;border-top:10px solid transparent;border-bottom:10px solid transparent}
.cup{width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#3b2314 0 58%,#f3efe8 60% 72%,#d9d4cb 74%);}
.cup::after{content:"";position:absolute;right:-48px;top:74px;width:60px;height:62px;border:16px solid #eae6de;border-left:none;border-radius:0 40px 40px 0}
.lens{width:330px;height:330px;border-radius:50%;box-shadow:inset 0 0 0 16px #1b1b1f,inset 0 0 0 20px #55565d,0 22px 40px rgba(0,0,0,.5);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 35%)}
.lens::after{content:"";position:absolute;top:290px;left:260px;width:48px;height:240px;border-radius:24px;background:linear-gradient(90deg,#141416,#35363c,#141416);transform:rotate(-40deg);transform-origin:top center}
.ig-top{position:absolute;top:22px;left:22px;right:22px;z-index:20;direction:ltr}
.segs{display:flex;gap:8px}.segs i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.4)}
.segs i.d{background:#fff}.segs i.h{background:linear-gradient(90deg,#fff 60%,rgba(255,255,255,.4) 60%)}
.ig-user{display:flex;align-items:center;gap:20px;margin-top:22px}
.ring{width:84px;height:84px;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,var(--ig1),var(--ig2),var(--ig3),var(--ig4),var(--ig5),var(--ig1))}
.ring div{width:100%;height:100%;border-radius:50%;border:4px solid #000;background:linear-gradient(135deg,#f0c2a2,#a2644c);display:grid;place-items:center;font:700 34px var(--ui);color:#3b1a0c}
.ig-user b{font:700 36px var(--ui)}.ig-user span{font:500 34px var(--ui);color:rgba(255,255,255,.75)}
.ig-user .x{margin-left:auto;font:400 60px/1 var(--ui);opacity:.95}
.ig-user .dots{font:900 40px var(--ui);letter-spacing:2px;margin-left:auto}
.st-text{position:absolute;z-index:18;font:700 60px var(--ui);background:#fff;color:#111;padding:10px 30px;border-radius:18px;transform:rotate(-4deg)}
.st-loc{position:absolute;z-index:18;background:#fff;border-radius:14px;padding:12px 26px;font:700 38px var(--ui);transform:rotate(3deg);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.st-loc span{background:linear-gradient(90deg,var(--ig4),var(--ig3),var(--ig2));-webkit-background-clip:text;color:transparent}
.poll{position:absolute;z-index:18;width:560px;border-radius:26px;background:#fff;color:#111;padding:26px 26px 20px;transform:rotate(-2deg);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.poll h4{font:700 40px var(--ui);text-align:center;margin-bottom:18px}
.opt{position:relative;height:76px;border-radius:40px;background:#efefef;margin-top:12px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:700 34px var(--ui)}
.opt i{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ig5),var(--ig4),var(--ig3));opacity:.9;border-radius:40px}
.opt span{position:relative;z-index:1}
.opt.w span{color:#fff}
.recov{position:absolute;top:200px;left:50%;transform:translateX(-50%);z-index:22;white-space:nowrap;background:rgba(255,48,64,.95);font:700 34px var(--ui);padding:14px 30px;border-radius:40px;box-shadow:0 10px 30px rgba(255,48,64,.45)}
.save{position:absolute;top:760px;left:30px;z-index:22;display:flex;flex-direction:column;align-items:center;gap:10px;width:150px;padding:22px 0;border-radius:30px;
  background:rgba(20,16,8,.7);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 2px rgba(232,182,74,.7);font:700 26px var(--ui);color:var(--gold2);text-align:center}
.save b{font-size:54px}
.ig-bottom{position:absolute;bottom:40px;left:36px;right:36px;display:flex;align-items:center;gap:30px;direction:ltr;z-index:50}
.ig-bottom .inp{flex:1;height:104px;border-radius:60px;border:2.5px solid rgba(255,255,255,.7);display:flex;align-items:center;padding:0 38px;font:500 36px var(--ui);color:rgba(255,255,255,.85)}
.ig-bottom svg{width:66px;height:66px}
#f6 .lt{bottom:230px}
#f6 .fade{bottom:190px;height:560px}

/* ═══ F7 Streamly ═══ */
#f7{background:var(--twbg)}
.tw-top{position:absolute;top:120px;left:0;right:0;height:120px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;direction:ltr;border-bottom:1px solid #2a2a30;background:var(--twp)}
.tw-logo{display:flex;align-items:center;gap:18px;font:900 50px var(--ui);letter-spacing:-1px}
.tw-mark{width:68px;height:68px;border-radius:16px;background:var(--tw);display:grid;place-items:center;box-shadow:6px 6px 0 #5c16c5}
.tw-mark svg{width:36px}
.tw-ic{display:flex;gap:30px;align-items:center}
.tw-ic span{width:56px;height:56px;border-radius:50%;background:#2f2f35}
.tw-ic span.av{background:linear-gradient(135deg,#ffb86b,#ff4d8d)}
.player{position:absolute;top:240px;left:0;right:0;height:608px;overflow:hidden;background:#050407}
.party{position:absolute;inset:0;background:linear-gradient(180deg,#1b1016,#0c080b)}
.party .bk{position:absolute;border-radius:50%}
